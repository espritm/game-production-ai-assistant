name: .NET CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up build SDK and .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          # .slnx requires a recent SDK; the application still targets .NET 8.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore GameProductionAIAssistant.slnx

      - name: Build solution
        run: dotnet build GameProductionAIAssistant.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --project GPAA.Tests/GPAA.Tests.csproj --configuration Release --no-build

      - name: Test plugin package verifier
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-plugin-package.Tests.ps1
