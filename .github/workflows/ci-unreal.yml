name: Unreal Plugin CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin-ue-5-6:
    name: Build plugin (UE 5.6, Win64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - windows
      - x64
      - unreal
      - ue-5.6
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve Unreal Engine installation
        shell: powershell
        run: |
          $engineRoot = [Environment]::GetEnvironmentVariable("UE_5_6_ROOT")
          if ([string]::IsNullOrWhiteSpace($engineRoot)) {
              $engineRoot = "C:\Program Files\Epic Games\UE_5.6"
          }

          $runUat = Join-Path $engineRoot "Engine\Build\BatchFiles\RunUAT.bat"
          if (-not (Test-Path -LiteralPath $runUat -PathType Leaf)) {
              throw "Unreal Automation Tool was not found at '$runUat'. Configure UE_5_6_ROOT on the runner."
          }

          "GPAA_ENGINE_ROOT=$engineRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify complete distribution package
        shell: powershell
        run: |
          & .\scripts\package-unreal-plugin.ps1 -UnrealEngineRoot $env:GPAA_ENGINE_ROOT

      - name: Install exact release archive and run Unreal smoke test
        shell: powershell
        run: |
          $version = (Get-Content plugin/GameProductionAIAssistant.uplugin -Raw | ConvertFrom-Json).VersionName
          & .\scripts\test-unreal-plugin-package.ps1 `
            -UnrealEngineRoot $env:GPAA_ENGINE_ROOT `
            -PackagePath ".gpaa\releases\GameProductionAIAssistant-v$version-UE5.6-Win64.zip"

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: gpaa-plugin-ue-5.6-win64-${{ github.sha }}
          path: ${{ github.workspace }}/.gpaa/releases/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpaa-smoke-ue-5.6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.gpaa/smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect Unreal Automation Tool logs
        if: always()
        shell: powershell
        run: |
          $source = Join-Path $env:APPDATA "Unreal Engine\AutomationTool\Logs"
          $destination = Join-Path $env:GITHUB_WORKSPACE ".gpaa\ci\uat-logs"
          if (Test-Path -LiteralPath $source) {
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force
          }

      - name: Upload Unreal Automation Tool logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpaa-uat-logs-ue-5.6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.gpaa/ci/uat-logs
          if-no-files-found: ignore
          retention-days: 7
