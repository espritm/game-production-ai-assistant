name: Native source policy
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source publication policy and release guards
        shell: pwsh
        run: |
          ./scripts/tests/public-source-policy.Tests.ps1
          ./scripts/tests/release-ref.Tests.ps1
          ./scripts/tests/publish-release.Tests.ps1
